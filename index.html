;outline:none;background:#fff;color:var(--text)}.textarea{min-height:88px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(52,120,246,.11)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:850;color:#596a81}.field small{font-size:10px;color:var(--muted)}.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.account{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.account-top{display:flex;gap:12px;align-items:center}.account-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#eaf2ff;color:#2c6ce3;font-size:19px}.account b,.account small{display:block}.account small{color:var(--muted);margin-top:3px}.balance{font-size:27px;font-weight:850;margin:18px 0 3px}.balance.negative{color:var(--red)}.balance.positive{color:var(--green)}.account p{font-size:11px;color:var(--muted);min-height:17px}.bar-row{display:grid;grid-template-columns:120px 1fr 100px;gap:10px;align-items:center;margin:10px 0;font-size:12px}.bar{height:9px;border-radius:99px;background:#edf1f6;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5c8ef4,#2d68db);border-radius:99px}.modal-bg{position:fixed;inset:0;background:rgba(6,15,28,.68);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-bg.show{display:flex}.modal{width:min(920px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 35px 100px rgba(0,0,0,.3)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.modal-head h3{margin:0;font-size:20px}.modal-close{background:#f0f3f7;border-radius:10px;font-size:22px;width:38px;height:38px}.modal-foot{display:flex;justify-content:fle <div id="app"></div><div id="modalBg" class="modal-bg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
"use strict";
const SB_URL="https://qttgoxncdsbqycbkxvsl.supabase.co/rest/v1/",SB_KEY="sb_publishable_g4oxZYNdgNkjpswa-c4P1g_uzUTu9s6";
const state={page:"dashboard",data:{cariler:[],banks:[],cash:[],checks:[],invoices:[],payments:[],transfers:[],islemler:[],cariMoves:[],bankMoves:[],cashMoves:[]},loading:false,busy:false};
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])),money=v=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2}).format(Number(v||0)),num=v=>Number(v||0),dateNow=()=>new Date().toISOString().slice(0,10),fmtDate=v=>v?new Date(v+"T00:00:00").toLocaleDateString("tr-TR"):"—",normalize=s=>String(s??"").toLocaleLowerCase("tr-TR");
function toast(msg,bad=false){const t=$("toast");t.textContent=msg;t.className="toast "+(bad?"bad":"show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.className="toast",4500)}function closeModal(){$("modalBg").classList.remove("show")}
function openModal(title,body,save,label="Kaydet"){const m=$("modal");m.innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" onclick="closeModal()">×</button></div>${body}<div class="modal-foot"><button class="btn soft" onclick="closeModal()">Vazgeç</button><button id="modalSave" class="btn primary">${esc(label)}</button></div>`;$("modalBg").classList.add("show");$("modalSave").onclick=async()=>{if(state.busy)return;state.busy=true;const b=$("modalSave");b.disabled=true;b.textContent="Kaydediliyor…";try{await save()}catch(e){toast(e.message||"İşlem başarısız",true)}finally{state.busy=false;if($("modalSave")){$("modalSave").disabled=false;$("modalSave").textContent=label}}}}
$("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal()});
async function api(path,opt={}){const method=(opt.method||"GET").toUpperCase(),h={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};if(method!=="GET")h.Prefer="return=representation";const r=await fetch(SB_URL+path,{...opt,headers:{...h,...(opt.headers||{})}}),text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok)throw new Error(data?.message||data?.hint||data?.details||data?.error||text||r.statusText);return data}
async function all(path){let out=[],from=0;while(true){const chunk=await api(path,{headers:{Range:`${from}-${from+999}`,Prefer:"count=none"}});if(!Array.isArray(chunk))return chunk;out.push(...chunk);if(chunk.length<1000)break;from+=1000}return out}
async function rpc(fn,args={}){return api("rpc/"+fn,{method:"POST",body:JSON.stringify(args)})}
function nav(page){state.page=page;location.hash=page;closeSide();render()}function openSide(){$("side")?.classList.add("open");$("shade")?.classList.add("show")}function closeSide(){$("side")?.classList.remove("open");$("shade")?.classList.remove("show")}
function title(){return({dashboard:"Genel Bakış",cariler:"Cari Hesaplar",bankalar:"Banka Hesapları",kasa:"Kasalar",transferler:"Para Transferleri",cekler:"Çek / Senet",faturalar:"Faturalar",tahsilatlar:"Tahsilatlar",raporlar:"Finansal Raporlar"}[state.page]||"Genel Bakış")}
function navBtn(p,ico,t){return `<button class="nav ${state.page===p?"active":""}" onclick="nav('${p}')"><span class="ico">${ico}</span><span>${t}</span></button>`}
function shell(){return `<div class="app"><aside id="side" class="sidebar"><div class="brand"><b>HİS FİNANS</b><span>Tek kaynaklı finans yönetimi</span></div><div class="section-title">ANA MENÜ</div>${navBtn("dashboard","⌂","Genel Bakış")}${navBtn("cariler","♟","Cari Hesaplar")}<div class="section-title">PARA YÖNETİMİ</div>${navBtn("bankalar","▤","Banka Hesapları")}${navBtn("kasa","▣","Kasalar")}${navBtn("transferler","⇄","Para Transferleri")}${navBtn("cekler","◈","Çek / Senet")}<div class="section-title">TİCARİ</div>${navBtn("faturalar","▧","Faturalar")}${navBtn("tahsilatlar","₺","Tahsilatlar")}${navBtn("raporlar","◩","Finansal Raporlar")}<div class="side-bottom"><span class="live-dot">●</span> Supabase bağlantısı canlı<br><span>Tek dosya uygulama • ${new Date().getFullYear()}</span></div></aside><div id="shade" class="shade" onclick="closeSide()"></div><main class="main"><header class="topbar"><div class="top-left"><button class="hamb" onclick="openSide()">☰</button><div><div class="crumb">HİS Finans / ${title()}</div><h1>${title()}</h1></div></div><div id="conn" class="connection">● BAĞLANIYOR</div></header><section id="content" class="content"></section></main></div>`}
async function load(){state.loading=true;renderLoading();try{const d=state.data;[d.cariler,d.banks,d.cash,d.checks,d.invoices,d.payments,d.transfers,d.islemler,d.cariMoves,d.bankMoves,d.cashMoves]=await Promise.all([all("cariler?select=*&order=created_at.desc"),all("banka_hesaplari?select=*&order=created_at.desc"),all("kasa_hesaplari?select=*&order=created_at.desc"),all("cek_senetler?select=*&order=vade_tarihi.asc,created_at.desc"),all("faturalar?select=*&order=vade_tarihi.asc,created_at.desc"),all("tahsilatlar?select=*&order=tarih.desc,created_at.desc"),all("finans_transferler?select=*&order=tarih.desc,created_at.desc"),all("finans_islemleri?select=*&order=created_at.desc"),all("cari_hareketleri?select=*&order=tarih.desc,created_at.desc"),all("banka_hareketleri?select=*&order=tarih.desc,created_at.desc"),all("kasa_hareketleri?select=*&order=tarih.desc,created_at.desc")]);state.loading=false;$("conn").textContent="● CANLI";$("conn").className="connection";render()}catch(e){state.loading=false;$("conn").textContent="● HATA";$("conn").className="connection bad";render();toast("Veriler alınamadı: "+e.message,true)}}
function renderLoading(){$("content").innerHTML=`<div class="loading">Finans motoru verileri yükleniyor…</div>`}function render(){if(!$("content"))$("app").innerHTML=shell();if(state.loading)return renderLoading();({dashboard,cariler,bankalar,kasa,transferler,cekler,faturalar,tahsilatlar,raporlar}[state.page]||dashboard)()}
function balanceBank(id){const b=state.data.banks.find(x=>x.id===id);return num(b?.acilis_bakiyesi)+state.data.bankMoves.filter(x=>x.banka_hesap_id===id).reduce((s,x)=>s+(x.tip==="giris"?1:-1)*num(x.tutar),0)}function balanceCash(id){const b=state.data.cash.find(x=>x.id===id);return num(b?.acilis_bakiyesi)+state.data.cashMoves.filter(x=>x.kasa_id===id).reduce((s,x)=>s+(x.tip==="giris"?1:-1)*num(x.tutar),0)}function balanceCari(id){return state.data.cariMoves.filter(x=>x.cari_id===id).reduce((s,x)=>s+(x.tip==="borc"?1:-1)*num(x.tutar),0)}function activeIslem(id){return state.data.islemler.find(x=>x.id===id)?.durum==="aktif"}
function cariOptions(sel=""){return state.data.cariler.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${esc(x.unvan)}</option>`).join("")}function bankOptions(sel=""){return state.data.banks.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${esc(x.banka_adi)}${x.hesap_adi?" — "+esc(x.hesap_adi):""}</option>`).join("")}function cashOptions(sel=""){return state.data.cash.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${esc(x.kasa_adi)}</option>`).join("")}function pageHead(h,p,buttons=""){return `<div class="page-head"><div><h2>${h}</h2><p>${p}</p></div><div class="actions">${buttons}</div></div>`}function metrics(items){return `<div class="metrics">${items.map(x=>`<div class="metric ${x.cls||""}"><small>${x.a}</small><b>${x.b}</b><span>${x.c||""}</span></div>`).join("")}</div>`}
function dashboard(){const d=state.data,bank=d.banks.reduce((s,x)=>s+balanceBank(x.id),0),cash=d.cash.reduce((s,x)=>s+balanceCash(x.id),0),debt=d.invoices.filter(x=>num(x.kalan_tutar)>0).reduce((s,x)=>s+num(x.kalan_tutar),0),today=dateNow(),soon=new Date();soon.setDate(soon.getDate()+7);const overdue=d.invoices.filter(x=>num(x.kalan_tutar)>0&&x.vade_tarihi&&x.vade_tarihi<today).reduce((s,x)=>s+num(x.kalan_tutar),0),due7=d.invoices.filter(x=>num(x.kalan_tutar)>0&&x.vade_tarihi&&x.vade_tarihi>=today&&new Date(x.vade_tarihi)<=soon).reduce((s,x)=>s+num(x.kalan_tutar),0),portfolio=d.checks.filter(x=>["portfoyde","bankaya_verildi"].includes(normalize(x.portfoy_durumu))).reduce((s,x)=>s+num(x.tutar),0),net=bank+cash-debt;const recent=d.cariMoves.slice(0,10);$("content").innerHTML=`<section class="hero"><div><small>YENİ NESİL FİNANS MERKEZİ</small><h2>Finansın tamamı tek ekranda.</h2><p>Cari, banka, kasa, fatura, tahsilat, çek/senet ve transfer işlemleri tek ana işlem mantığıyla yönetilir. Düzenleme ve iptaller bağlı kayıtları birlikte korur.</p><div class="actions"><button class="btn primary" onclick="newCariMove()">+ Cari Hareket</button><button class="btn success" onclick="newInvoice()">+ Fatura</button><button class="btn white" onclick="newPayment()">+ Tahsilat</button><button class="btn white" onclick="newTransfer()">+ Transfer</button></div></div><div class="hero-value"><span>NET FİNANSAL POZİSYON</span><b>${money(net)}</b><span>Banka + kasa − açık fatura</span></div></section>${metrics([{a:"Cari Hesap",b:d.cariler.length,c:"hesap"},{a:"Açık Fatura",b:money(debt),c:"kalan bakiye",cls:"red"},{a:"Banka Net",b:money(bank),c:"tüm hesaplar",cls:"blue"},{a:"Kasa Net",b:money(cash),c:"tüm kasalar",cls:"green"},{a:"Çek/Senet",b:money(portfolio),c:"portföy",cls:"orange"},{a:"Vadesi Geçen",b:money(overdue),c:"acil takip",cls:"red"},{a:"7 Gün",b:money(due7),c:"vade alarmı",cls:"orange"}])}<div class="grid2"><div class="card"><div class="card-head"><h3>Hızlı Modüller</h3><span class="mini">tek tık</span></div><div class="modules"><button class="module" onclick="nav('cariler')"><strong>♟</strong><b>Cariler</b><small>${d.cariler.length} kayıt</small></button><button class="module" onclick="nav('bankalar')"><strong>▤</strong><b>Bankalar</b><small>${d.banks.length} hesap</small></button><button class="module" onclick="nav('kasa')"><strong>▣</strong><b>Kasalar</b><small>${d.cash.length} kasa</small></button><button class="module" onclick="nav('cekler')"><strong>◈</strong><b>Çek / Senet</b><small>${d.checks.length} evrak</small></button><button class="module" onclick="nav('faturalar')"><strong>▧</strong><b>Faturalar</b><small>${d.invoices.length} kayıt</small></button><button class="module" onclick="nav('tahsilatlar')"><strong>₺</strong><b>Tahsilatlar</b><small>${d.payments.length} kayıt</small></button></div></div><div class="card"><div class="card-head"><h3>Vade ve Risk Merkezi</h3><button class="btn soft" onclick="nav('faturalar')">Faturaları Aç</button></div><div class="alert red"><span>Vadesi geçen</span><b>${money(overdue)}</b></div><div class="alert orange"><span>7 gün içinde</span><b>${money(due7)}</b></div><div class="alert green"><span>Banka</span><b>${money(bank)}</b></div><div class="alert"><span>Kasa</span><b>${money(cash)}</b></div></div></div><div class="card"><div class="card-head"><h3>Son Cari Hareketleri</h3><button class="btn soft" onclick="nav('raporlar')">Tüm Raporlar</button></div>${cariTable(recent,true)}</div>`}
function cariTable(rows,compact=false){return `<div class="table-wrap"><table class="table"><thead><tr><th>Tarih</th><th>Cari</th><th>Yön</th><th>Belge</th><th>Kaynak</th><th class="num">Tutar</th>${compact?"":"<th>İşlem</th>"}</tr></thead><tbody>${rows.map(x=>{const c=state.data.cariler.find(c=>c.id===x.cari_id);return `<tr><td>${fmtDate(x.tarih)}</td><td><b>${esc(c?.unvan||"Cari")}</b><br><small>${esc(x.aciklama||"")}</small></td><td>${x.tip==="borc"?'<span class="pill bad">BORÇ</span>':'<span class="pill good">ALACAK</span>'}</td><td>${esc(x.belge_no||"—")}</td><td>${esc(x.kaynak_turu||"manuel")}</td><td class="num">${money(x.tutar)}</td>${compact?"":`<td><button class="icon-btn" onclick="showLinked('${x.islem_id||""}')">Detay</button></td>`}</tr>`}).join("")||`<tr><td colspan="${compact?6:7}" class="empty">Kayıt bulunamadı.</td></tr>`}</tbody></table></div>`}
function cariler(){let q="";$("content").innerHTML=pageHead("Cari Hesaplar","Müşteri, tedarikçi ve diğer cari hesaplar.",`<button class="btn success" onclick="newCari()">+ Yeni Cari</button><button class="btn primary" onclick="newCariMove()">+ Hareket</button>`)+`<div class="card"><div class="searchbar"><input id="cq" class="input" placeholder="Unvan, vergi no, telefon ara…"></div><div id="cariGrid"></div></div>`;const draw=()=>{q=normalize($("cq").value);const a=state.data.cariler.filter(c=>(`${c.unvan} ${c.vergi_no||""} ${c.telefon||""}`).toLocaleLowerCase("tr-TR").includes(q));$("cariGrid").innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Cari</th><th>Vergi/T.C.</th><th>Telefon</th><th>Limit</th><th>Bakiye</th><th>İşlem</th></tr></thead><tbody>${a.map(c=>{const b=balanceCari(c.id);return `<tr><td><b>${esc(c.unvan)}</b><br><small>${esc(c.yetkili||c.email||"")}</small></td><td>${esc(c.vergi_no||"—")}</td><td>${esc(c.telefon||"—")}</td><td>${money(c.limit_tutari)}</td><td class="${b>0?"danger-text":b<0?"success-text":""}">${money(Math.abs(b))}</td><td><div class="row-actions"><button class="icon-btn" onclick="cariDetail('${c.id}')">Aç</button><button class="icon-btn" onclick="editCari('${c.id}')">Düzenle</button></div></td></tr>`}).join("")||`<tr><td colspan="6" class="empty">Cari bulunamadı.</td></tr>`}</tbody></table></div>`};$("cq").oninput=draw;draw()}
function newCari(){openModal("Yeni Cari",`<div class="form"><div class="field full"><label>Ad Soyad / Firma *</label><input id="cu" class="input" autofocus></div><div class="field"><label>Telefon</label><input id="ctel" class="input"></div><div class="field"><label>E-posta</label><input id="cmail" class="input"></div><div class="field"><label>Vergi / T.C. No</label><input id="cvno" class="input"></div><div class="field"><label>Vergi Dairesi</label><input id="cvd" class="input"></div><div class="field"><label>Yetkili</label><input id="cyet" class="input"></div><div class="field"><label>Limit</label><input id="clim" class="input" type="number" step="0.01" value="0"></div><div class="field"><label>Varsayılan Vade (gün)</label><input id="cvade" class="input" type="number" value="0"></div><div class="field full"><label>Adres</label><textarea id="cadr" class="textarea"></textarea></div><div class="field full"><label>Risk Notu</label><textarea id="crisk" class="textarea"></textarea></div></div>`,async()=>{const unvan=$("cu").value.trim();if(!unvan)throw Error("Cari adı zorunlu.");await api("cariler",{method:"POST",body:JSON.stringify({unvan,telefon:$("ctel").value.trim()||null,email:$("cmail").value.trim()||null,vergi_no:$("cvno").value.trim()||null,vergi_dairesi:$("cvd").value.trim()||null,yetkili:$("cyet").value.trim()||null,limit_tutari:num($("clim").value),varsayilan_vade_gun:parseInt($("cvade").value||0),adres:$("cadr").value.trim()||null,risk_notu:$("crisk").value.trim()||null,aktif:true})});closeModal();await load();toast("Cari oluşturuldu.")})}
function editCari(id){const x=state.data.cariler.find(c=>c.id===id);if(!x)return;openModal("Cari Düzenle",`<div class="form"><div class="field full"><label>Ad Soyad / Firma *</label><input id="cu" class="input" value="${esc(x.unvan)}"></div><div class="field"><label>Telefon</label><input id="ctel" class="input" value="${esc(x.telefon||"")}"></div><div class="field"><label>E-posta</label><input id="cmail" class="input" value="${esc(x.email||"")}"></div><div class="field"><label>Vergi / T.C. No</label><input id="cvno" class="input" value="${esc(x.vergi_no||"")}"></div><div class="field"><label>Vergi Dairesi</label><input id="cvd" class="input" value="${esc(x.vergi_dairesi||"")}"></div><div class="field"><label>Yetkili</label><input id="cyet" class="input" value="${esc(x.yetkili||"")}"></div><div class="field"><label>Limit</label><input id="clim" class="input" type="number" step="0.01" value="${num(x.limit_tutari)}"></div><div class="field"><label>Varsayılan Vade (gün)</label><input id="cvade" class="input" type="number" value="${num(x.varsayilan_vade_gun)}"></div><div class="field full"><label>Adres</label><textarea id="cadr" class="textarea">${esc(x.adres||"")}</textarea></div><div class="field full"><label>Risk Notu</label><textarea id="crisk" class="textarea">${esc(x.risk_notu||"")}</textarea></div></div>`,async()=>{const unvan=$("cu").value.trim();if(!unvan)throw Error("Cari adı zorunlu.");await api(`cariler?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({unvan,telefon:$("ctel").value.trim()||null,email:$("cmail").value.trim()||null,vergi_no:$("cvno").value.trim()||null,vergi_dairesi:$("cvd").value.trim()||null,yetkili:$("cyet").value.trim()||null,limit_tutari:num($("clim").value),varsayilan_vade_gun:parseInt($("cvade").value||0),adres:$("cadr").value.trim()||null,risk_notu:$("crisk").value.trim()||null})});closeModal();await load();toast("Cari güncellendi.")})}
function cariDetail(id){const c=state.data.cariler.find(x=>x.id===id),rows=state.data.cariMoves.filter(x=>x.cari_id===id);openModal("Cari Detay",`<div class="grid2"><div class="card" style="margin:0"><span class="mini">Cari</span><div class="stat-big">${esc(c?.unvan||"")}</div><p class="muted">${esc(c?.vergi_no||"Vergi/T.C. yok")} • ${esc(c?.telefon||"Telefon yok")}</p></div><div class="card" style="margin:0"><span class="mini">Güncel Bakiye</span><div class="stat-big ${balanceCari(id)>0?"danger-text":balanceCari(id)<0?"success-text":""}">${money(Math.abs(balanceCari(id)))}</div><p class="muted">${balanceCari(id)>0?"Borçlu":balanceCari(id)<0?"Alacaklı":"Kapalı"}</p></div></div><div class="actions" style="margin:15px 0"><button class="btn primary" onclick="closeModal();newCariMoveFor('${id}')">+ Cari Hareketi Ekle</button><button class="btn soft" onclick="closeModal();editCari('${id}')">Cariyi Düzenle</button></div><div style="margin-top:15px">${cariTable(rows,false)}</div>`,closeModal,"Kapat")}
function newCariMoveFor(id){newCariMove();setTimeout(()=>{if($("mCari"))$("mCari").value=id},0)}
function newCariMove(){if(!state.data.cariler.length)return toast("Önce cari oluşturun.",true);openModal("Yeni Cari Hareketi",`<div class="notice">Cari hareketini buradan oluştur. Banka veya kasa seçersen cari ile para hareketi aynı ana işleme bağlanır.</div><div class="form"><div class="field"><label>Cari *</label><select id="mCari" class="select">${cariOptions()}</select></div><div class="field"><label>Yön *</label><select id="mTip" class="select"><option value="borc">Borç</option><option value="alacak">Alacak</option></select></div><div class="field"><label>Tarih</label><input id="mDate" class="input" type="date" value="${dateNow()}"></div><div class="field"><label>Vade</label><input id="mDue" class="input" type="date"></div><div class="field"><label>Tutar *</label><input id="mAmt" class="input" type="number" min="0" step="0.01"></div><div class="field"><label>Belge No</label><input id="mDoc" class="input"></div><div class="field"><label>Banka</label><select id="mBank" class="select"><option value="">Yok</option>${bankOptions()}</select></div><div class="field"><label>Kasa</label><select id="mCash" class="select"><option value="">Yok</option>${cashOptions()}</select></div><div class="field full"><label>Açıklama</label><textarea id="mDesc" class="textarea"></textarea></div></div>`,async()=>{const bank=$("mBank").value||null,cash=$("mCash").value||null;if(bank&&cash)throw Error("Banka veya kasa seçin; ikisini birlikte kullanmayın.");const id=await rpc("finans_cari_ekle",{p_cari:$("mCari").value,p_tarih:$("mDate").value,p_tip:$("mTip").value,p_tutar:num($("mAmt").value),p_vade:$("mDue").value||null,p_belge:$("mDoc").value.trim()||null,p_aciklama:$("mDesc").value.trim()||null,p_banka:bank,p_kasa:cash});closeModal();await load();toast("Cari hareketi kaydedildi. İşlem #"+await islemNo(id))})}
async function islemNo(id){return state.data.islemler.find(i=>i.id===id)?.islem_no||"—"}
function bankalar(){const rows=state.data.banks;$("content").innerHTML=pageHead("Banka Hesapları","Banka hesapları, bakiyeler ve tek işlem hareket merkezi.",`<button class="btn success" onclick="newBank()">+ Banka Hesabı</button><button class="btn primary" onclick="newBankMove()">+ Banka Hareketi</button>`)+`<div class="account-grid">${rows.map(b=>`<div class="account"><div class="account-top"><div class="account-icon">▤</div><div><b>${esc(b.banka_adi)}</b><small>${esc(b.hesap_adi||"Hesap")}</small></div></div><div class="balance ${balanceBank(b.id)<0?"negative":"positive"}">${money(balanceBank(b.id))}</div><p>${esc(b.iban||"IBAN girilmemiş")}</p><div class="row-actions"><button class="icon-btn" onclick="bankDetail('${b.id}')">Hareketler</button><button class="icon-btn" onclick="editBank('${b.id}')">Düzenle</button></div></div>`).join("")||`<div class="card"><div class="empty">Banka hesabı yok.</div></div>`}</div>`}
function newBank(){openModal("Yeni Banka Hesabı",`<div class="form"><div class="field"><label>Banka Adı *</label><input id="bn" class="input"></div><div class="field"><label>Hesap Adı</label><input id="bh" class="input"></div><div class="field"><label>Şube</label><input id="bs" class="input"></div><div class="field"><label>IBAN</label><input id="bi" class="input"></div><div class="field"><label>Hesap No</label><input id="bno" class="input"></div><div class="field"><label>Açılış Bakiyesi</label><input id="bb" class="input" type="number" step="0.01" value="0"></div><div class="field"><label>Para Birimi</label><input id="bp" class="input" value="TRY"></div><div class="field full"><label>Notlar</label><textarea id="bnote" class="textarea"></textarea></div></div>`,async()=>{const n=$("bn").value.trim();if(!n)throw Error("Banka adı zorunlu.");await api("banka_hesaplari",{method:"POST",body:JSON.stringify({banka_adi:n,hesap_adi:$("bh").value.trim()||null,sube:$("bs").value.trim()||null,iban:$("bi").value.trim()||null,hesap_no:$("bno").value.trim()||null,acilis_bakiyesi:num($("bb").value),para_birimi:$("bp").value.trim()||"TRY",notlar:$("bnote").value.trim()||null,aktif:true})});closeModal();await load();toast("Banka hesabı oluşturuldu.")})}
function editBank(id){const x=state.data.banks.find(b=>b.id===id);openModal("Banka Hesabı Düzenle",`<div class="notice">Hareket oluşmuş bir hesabın açılış bakiyesi veritabanı tarafından kilitlenebilir. Böyle bir durumda düzeltmeyi finansal hareket olarak yap.</div><div class="form"><div class="field"><label>Banka Adı *</label><input id="bn" class="input" value="${esc(x.banka_adi)}"></div><div class="field"><label>Hesap Adı</label><input id="bh" class="input" value="${esc(x.hesap_adi||"")}"></div><div class="field"><label>Şube</label><input id="bs" class="input" value="${esc(x.sube||"")}"></div><div class="field"><label>IBAN</label><input id="bi" class="input" value="${esc(x.iban||"")}"></div><div class="field"><label>Hesap No</label><input id="bno" class="input" value="${esc(x.hesap_no||"")}"></div><div class="field"><label>Açılış Bakiyesi</label><input id="bb" class="input" type="number" step="0.01" value="${num(x.acilis_bakiyesi)}"></div><div class="field"><label>Para Birimi</label><input id="bp" class="input" value="${esc(x.para_birimi||"TRY")}"></div><div class="field full"><label>Notlar</label><textarea id="bnote" class="textarea">${esc(x.notlar||"")}</textarea></div></div>`,async()=>{await api(`banka_hesaplari?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({banka_adi:$("bn").value.trim(),hesap_adi:$("bh").value.trim()||null,sube:$("bs").value.trim()||null,iban:$("bi").value.trim()||null,hesap_no:$("bno").value.trim()||null,acilis_bakiyesi:num($("bb").value),para_birimi:$("bp").value.trim()||"TRY",notlar:$("bnote").value.trim()||null})});closeModal();await load();toast("Banka hesabı güncellendi.")})}function bankDetail(id){const b=state.data.banks.find(x=>x.id===id),rows=state.data.bankMoves.filter(x=>x.banka_hesap_id===id);openModal("Banka Hareketleri",`<div class="grid2"><div class="card" style="margin:0"><span class="mini">Hesap</span><div class="stat-big">${esc(b?.banka_adi||"")}</div><p class="muted">${esc(b?.iban||"")}</p></div><div class="card" style="margin:0"><span class="mini">Bakiye</span><div class="stat-big">${money(balanceBank(id))}</div></div></div><div class="actions" style="margin:15px 0"><button class="btn primary" onclick="closeModal();newBankMove('${id}')">+ Hareket</button></div>${bankMoveTable(rows)}`,closeModal,"Kapat")}
function bankMoveTable(rows){return `<div class="table-wrap"><table class="table"><thead><tr><th>Tarih</th><th>Cari</th><th>Tip</th><th>Belge</th><th>Açıklama</th><th class="num">Tutar</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>${rows.map(x=>{const act=activeIslem(x.islem_id);return `<tr><td>${fmtDate(x.tarih)}</td><td>${esc(state.data.cariler.find(c=>c.id===x.cari_id)?.unvan||"—")}</td><td>${x.tip==="giris"?'<span class="pill good">GİRİŞ</span>':'<span class="pill bad">ÇIKIŞ</span>'}</td><td>${esc(x.belge_no||"—")}</td><td>${esc(x.aciklama||"—")}</td><td class="num">${money(x.tutar)}</td><td>${act?'<span class="pill good">AKTİF</span>':'<span class="pill bad">İPTAL</span>'}</td><td>${act?`<button class="icon-btn" onclick="editTransaction('${x.islem_id}')">Düzenle</button>`:`<span class="mini">Geçmiş kayıt</span>`}</td></tr>`}).join("")||`<tr><td colspan="8" class="empty">Hareket yok.</td></tr>`}</tbody></table></div>`}

<style>.hys-sortbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:9px 10px;background:#f8fafc;border:1px solid #e7edf4;border-radius:11px}.hys-sortbar span{font-size:10px;font-weight:850;color:#6b7b90;text-transform:uppercase;letter-spacing:.5px}.hys-sortbar select{min-width:190px;padding:8px 10px;border:1px solid #d8e1eb;border-radius:9px;background:#fff;color:#26364d;font-size:11px;font-weight:750}.hys-sortbar button{padding:8px 10px;border-radius:9px;background:#eef3f8;color:#33445c;font-size:11px;font-weight:800}</style><script>
/* HYS_UNIVERSAL_SORT_V1 */
(function(){
  "use strict";
  const norm=s=>String(s||"").toLocaleLowerCase("tr-TR");
  const amount=s=>{let x=String(s||"").replace(/[^0-9,.-]/g,"").replace(/\./g,"").replace(",",".");return Number(x)||0};
  const date=s=>{let t=String(s||"").trim(),m=t.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]).getTime()||0;let d=Date.parse(t);return Number.isNaN(d)?0:d};
  const indexOf=(heads,words)=>{for(const w of words){const i=heads.findIndex(h=>h.includes(w));if(i>=0)return i}return -1};
  function sortTable(table,mode){
    const heads=[...table.querySelectorAll("thead th")].map(x=>norm(x.textContent));
    const rows=[...table.querySelectorAll("tbody tr")];
    if(!rows.length||!table.tBodies.length)return;
    const di=indexOf(heads,["tarih","işlem tarihi","vade"]);
    const ai=indexOf(heads,["tutar","bakiye","toplam","borç","alacak"]);
    const ni=indexOf(heads,["cari","unvan","banka","kasa","açıklama"]);
    let cmp;
    if(mode==="date_desc"&&di>=0)cmp=(a,b)=>date(b.cells[di]?.textContent)-date(a.cells[di]?.textContent);
    else if(mode==="date_asc"&&di>=0)cmp=(a,b)=>date(a.cells[di]?.textContent)-date(b.cells[di]?.textContent);
    else if(mode==="amount_desc"&&ai>=0)cmp=(a,b)=>amount(b.cells[ai]?.textContent)-amount(a.cells[ai]?.textContent);
    else if(mode==="amount_asc"&&ai>=0)cmp=(a,b)=>amount(a.cells[ai]?.textContent)-amount(b.cells[ai]?.textContent);
    else {const i=ni>=0?ni:0;cmp=(a,b)=>norm(a.cells[i]?.textContent).localeCompare(norm(b.cells[i]?.textContent),"tr",{sensitivity:"base"});if(mode==="name_desc"){const base=cmp;cmp=(a,b)=>base(b,a)}}
    rows.sort(cmp).forEach(r=>table.tBodies[0].appendChild(r));
  }
  function addBar(table){
    const wrap=table.closest(".table-wrap");
    if(!wrap||wrap.previousElementSibling?.classList.contains("hys-sortbar"))return;
    const bar=document.createElement("div");bar.className="hys-sortbar";
    bar.innerHTML='<span>Sırala</span><select aria-label="Liste sıralama"><option value="date_desc">Yeni → Eski</option><option value="date_asc">Eski → Yeni</option><option value="amount_desc">Tutar Büyük → Küçük</option><option value="amount_asc">Tutar Küçük → Büyük</option><option value="name_asc">A → Z</option><option value="name_desc">Z → A</option></select><button type="button">↺ Varsayılan</button>';
    wrap.parentNode.insertBefore(bar,wrap);
    const select=bar.querySelector("select");
    select.addEventListener("change",()=>sortTable(table,select.value));
    bar.querySelector("button").addEventListener("click",()=>{select.value="date_desc";sortTable(table,"date_desc")});
    sortTable(table,"date_desc");
  }
  function scan(){document.querySelectorAll(".table-wrap table").forEach(addBar)}
  let timer;
  const observer=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(scan,40)});
  function start(){scan();observer.observe(document.getElementById("app")||document.body,{childList:true,subtree:true})}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
})();

</script>

(function(){

  function esc2(v){return String(v??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

    }).join("")||`<tr><td colspan="7" class="empty">Hareket yok.</td></tr>`}</tbody></table></div>`;
  };

  cashMoveTable=function(rows){
    rows=Array.isArray(rows)?rows:[];
    return `<div class="table-wrap"><table class="table"><thead><tr><th>Tarih</th><th>Cari</th><th>Tip</th><th>Belge</th><th>Açıklama</th><th class="num">Tutar</th><th>İşlem</th></tr></thead><tbody>${rows.map(x=>{

    openModal("Cari Detay",`<div class="grid2"><div class="card" style="margin:0"><span class="mini">Cari</span><div class="stat-big">${esc2(c?.unvan||"")}</div><p class="muted">${esc2(c?.vergi_no||"Vergi/T.C. yok")} • ${esc2(c?.telefon||"Telefon yok")}</p></div><div class="card" style="margin:0"><span class="mini">Güncel Bakiye</span><div class="stat-big ${balanceCari(id)>0?"danger-text":balanceCari(id)<0?"success-text":""}">${money2(Math.abs(balanceCari(id)))}</div><p class="muted">${balanceCari(id)>0?"Borçlu":balanceCari(id)<0?"Alacaklı":"Kapalı"}</p></div></div><div class="actions" style="margin:15px 0"><button class="btn primary" onclick="closeModal();newCariMoveFor('${esc2(id)}')">+ Cari Hareketi Ekle</button><button class="btn soft" onclick="closeModal();editCari('${esc2(id)}')">Cariyi Düzenle</button></div><div class="notice">Kural: Cari hareketi banka veya kasa ile bağlıysa düzenleme aynı ana işlem üzerinden yapılır; cari, banka/kasa ve tutar birlikte güncellenir. İptal de bağlı yansımayı birlikte iptal eder.</div><div style="margin-top:15px">${cariTable(rows,false)}</div>`,closeModal,"Kapat");

<script>
/* HYS_CANCELLED_PAYMENT_HISTORY_V2 */
(function(){
  "use strict";
  const KEY="his_cancelled_payments_v2";
  const read=()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}};
  const write=a=>localStorage.setItem(KEY,JSON.stringify(a.slice(-200)));
  const remember=p=>{if(!p||!p.islem_id)return;const a=read().filter(x=>x.islem_id!==p.islem_id);a.push({...p,_cancelled:true});write(a)};
  const merge=()=>{const list=read(),payments=state?.data?.payments||[],ids=new Set(payments.map(x=>x.islem_id));list.forEach(x=>{if(!ids.has(x.islem_id))payments.push(x)});state.data.payments=payments};
  if(typeof window.load==="function"){
    const oldLoad=window.load;
    window.load=async function(){await oldLoad();merge();try{if(typeof render==="function")render()}catch(e){}};
    try{merge()}catch(e){}
  }
  if(typeof window.voidTransaction==="function"){
    const oldVoid=window.voidTransaction;
    window.voidTransaction=async function(islem,type){
      if(type==="tahsilat"){
        const p=(state?.data?.payments||[]).find(x=>x.islem_id===islem);
        if(p)remember(p);
      }
      return oldVoid(islem,type);
    };
  }
  try{if(typeof render==="function")render()}catch(e){}
})();
</script>

    const text=titles[page];
    const crumb=document.querySelector(".crumb");
    const h1=document.querySelector(".topbar h1");
    if(crumb)crumb.textContent="HİS Finans / "+text;
    if(h1)h1.textContent=text;
    document.querySelectorAll(".sidebar .nav").forEach(btn=>{
      btn.classList.toggle("active",btn.textContent.trim().includes(text));
    });
  }
  const oldNav=window.nav;
  if(typeof oldNav==="function"){
    window.nav=function(page){
      oldNav(page);
      sync(page);
    };
  }
  window.addEventListener("hashchange",function(){
    const page=location.hash.slice(1)||"dashboard";
    sync(page);
  });
  sync(state.page);
})();
</script>
</body>
</html>
