name: Patch cancelled payment history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cancelled-payments]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'HYS_CANCELLED_PAYMENTS_V1'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)
          old = 'function tahsilatlar(){let q="",f="all";'
          helper = '''/* HYS_CANCELLED_PAYMENTS_V1 */\nfunction displayPayments(){const active=state.data.payments.slice();const known=new Set(active.map(x=>x.islem_id).filter(Boolean));const cancelled=state.data.islemler.filter(i=>i.islem_turu==="tahsilat"&&i.durum==="iptal"&&!known.has(i.id)).map(i=>({id:null,islem_id:i.id,cari_id:null,fatura_id:null,tarih:i.tarih,tutar:i.tutar,odeme_yontemi:null,belge_no:i.islem_no?"İşlem #"+i.islem_no:null,aciklama:i.aciklama||"İptal edilen tahsilat",__synthetic:true}));return active.concat(cancelled)}\nfunction tahsilatlar(){let q="",f="all";'''
          if old not in s:
              raise SystemExit('Target function not found')
          s = s.replace(old, helper, 1)
          old2 = 'const a=state.data.payments.filter(x=>{'
          new2 = 'const a=displayPayments().filter(x=>{'
          if old2 not in s:
              raise SystemExit('Payment filter target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "[cancelled-payments] Preserve cancelled payment history in UI"
          git push
