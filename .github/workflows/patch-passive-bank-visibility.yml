name: patch-passive-bank-visibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-passive-bank-visibility.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- HSF_PASSIVE_BANKS_PATCH_V1 -->'
          if marker not in s:
              patch=r'''<!-- HSF_PASSIVE_BANKS_PATCH_V1 -->
          <style>
          .hsf-status-filter{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
          .hsf-status-filter button{padding:9px 13px;border-radius:10px;background:#eef3f8;color:#304158;font-weight:800;font-size:11px;border:1px solid #dce5ef}
          .hsf-status-filter button.active{background:#3478f6;color:#fff;border-color:#3478f6}
          .hsf-passive-card{position:relative;opacity:.88}
          .hsf-passive-card:before{content:'PASİF';position:absolute;right:16px;top:16px;background:#fee2e2;color:#b42331;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:900}
          .hsf-passive-card .balance{color:#718096!important}
          .hsf-passive-empty{padding:30px;text-align:center;color:#98a5b6;background:#fff;border:1px dashed #d8e1eb;border-radius:16px;grid-column:1/-1}
          </style>
          <script>
          (function(){
            'use strict';
            const HSF_BANK_PATCH={filter:'all',loaded:false,banks:[]};
            const H=()=>document.querySelector('.hsf-status-filter');
            const bankPage=()=>typeof state!=='undefined' && state.page==='banks';
            const bankGrid=()=>document.querySelector('.account-grid');
            const moneyH=v=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(v||0));
            async function loadBanks(){
              try{
                const rows=await api('banka_hesaplari?select=id,banka_adi,hesap_adi,sube,iban,hesap_no,acilis_bakiyesi,para_birimi,notlar,aktif,created_at&order=created_at.asc');
                HSF_BANK_PATCH.banks=Array.isArray(rows)?rows:[]; HSF_BANK_PATCH.loaded=true;
              }catch(e){console.warn('HSF banka filtreleri:',e)}
            }
            function passiveCards(){
              const g=bankGrid(); if(!g||!bankPage()) return;
              g.querySelectorAll('.hsf-passive-card,.hsf-passive-empty').forEach(x=>x.remove());
              const rows=HSF_BANK_PATCH.banks.filter(x=>x.aktif===false);
              if(!rows.length){
                if(HSF_BANK_PATCH.filter==='passive') g.insertAdjacentHTML('beforeend','<div class="hsf-passive-empty">Pasif banka hesabı bulunmuyor.</div>');
                return;
              }
              rows.forEach(b=>{
                const title=[b.banka_adi,b.hesap_adi].filter(Boolean).join(' — ')||'Banka Hesabı';
                const sub=[b.sube,b.iban||b.hesap_no].filter(Boolean).join(' · ')||'Hesap bilgisi yok';
                g.insertAdjacentHTML('beforeend',`<div class="account hsf-passive-card" data-bank-status="passive"><div class="account-top"><div class="account-icon">🏦</div><div><b>${esc(title)}</b><small>${esc(sub)}</small></div></div><div class="balance">${moneyH(b.acilis_bakiyesi)}</div><p>${esc(b.notlar||'Bu hesap pasif durumda. Yeni finansal işlemlerde kullanılamaz.')}</p><div class="mini">Hesap durumu: <strong>Pasif</strong></div></div>`);
              });
            }
            function applyFilter(){
              if(!bankPage()) return;
              const g=bankGrid(); if(!g) return;
              g.querySelectorAll('.account:not(.hsf-passive-card)').forEach(x=>x.style.display=HSF_BANK_PATCH.filter==='passive'?'none':'');
              g.querySelectorAll('.hsf-passive-card').forEach(x=>x.style.display=HSF_BANK_PATCH.filter==='active'?'none':'');
              H()?.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.filter===HSF_BANK_PATCH.filter));
            }
            function ensureFilter(){
              if(!bankPage()) return;
              const head=document.querySelector('.page-head'); if(!head) return;
              if(!H()){
                const el=document.createElement('div'); el.className='hsf-status-filter'; el.innerHTML='<button data-filter="all" class="active">Tümü</button><button data-filter="active">Aktif</button><button data-filter="passive">Pasif</button>';
                head.insertAdjacentElement('afterend',el);
                el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;HSF_BANK_PATCH.filter=b.dataset.filter;passiveCards();applyFilter();});
              }
              if(!HSF_BANK_PATCH.loaded) loadBanks().then(()=>{passiveCards();applyFilter();}); else {passiveCards();applyFilter();}
            }
            function disablePassiveOptions(){
              if(!HSF_BANK_PATCH.loaded) return;
              const ids=new Set(HSF_BANK_PATCH.banks.filter(x=>x.aktif===false).map(x=>String(x.id)));
              document.querySelectorAll('select').forEach(sel=>sel.querySelectorAll('option').forEach(o=>{if(ids.has(String(o.value))){o.disabled=true;o.textContent=o.textContent.replace(/\s*—\s*PASİF$/,'')+' — PASİF';}}));
            }
            let last='';
            const tick=()=>{const sig=(typeof state!=='undefined'&&state.page)||'';if(sig!==last){last=sig;if(sig==='banks')setTimeout(ensureFilter,40)}disablePassiveOptions();};
            new MutationObserver(tick).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
            setInterval(tick,700);
            window.addEventListener('hashchange',()=>setTimeout(tick,40));
            setTimeout(tick,100);
          })();
          </script>
          '''
              s=s.replace('</body>',patch+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/patch-passive-bank-visibility.yml
          git commit -m 'Add active and passive bank account filters [skip ci]'
          git push