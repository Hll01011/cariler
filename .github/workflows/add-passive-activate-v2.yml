name: Add working activate control for passive bank accounts

on:
  push:
    paths:
      - '.github/workflows/add-passive-activate-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append passive activation script
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'HSF_PASSIVE_ACTIVATE_V2' in s:
              raise SystemExit('already patched')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('body marker not found')
          script = '''
<!-- HSF_PASSIVE_ACTIVATE_V2 -->
<script>
(function(){
  const bankPage=()=>typeof state!=='undefined' && state.page==='bankalar';
  async function activate(id){
    if(!id) return;
    if(!confirm('Bu banka hesabını tekrar aktif hale getirmek istiyor musunuz?')) return;
    try{
      const r=await fetch(SB_URL+'banka_hesaplari?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({aktif:true})});
      if(!r.ok){const t=await r.text();throw new Error(t||'Aktifleştirme başarısız.')}
      toast('Banka hesabı tekrar aktif hale getirildi.');
      setTimeout(()=>location.reload(),500);
    }catch(e){toast(e.message||'Aktifleştirme başarısız.',true)}
  }
  async function addButtons(){
    if(!bankPage()) return;
    const cards=[...document.querySelectorAll('.hsf-passive-card:not([data-activate-added])')];
    if(!cards.length) return;
    let banks=[];
    try{banks=await fetch(SB_URL+'banka_hesaplari?aktif=eq.false&select=id,banka_adi,hesap_adi').then(r=>r.json())}catch(e){return}
    cards.forEach(card=>{
      const title=(card.querySelector('.account-top b')?.textContent||'').trim();
      const bank=banks.find(x=>[x.banka_adi,x.hesap_adi].filter(Boolean).join(' — ')===title);
      if(!bank) return;
      const box=document.createElement('div');
      box.className='row-actions';
      box.style.marginTop='12px';
      const btn=document.createElement('button');
      btn.className='icon-btn success';
      btn.textContent='Aktifleştir';
      btn.onclick=()=>activate(bank.id);
      box.appendChild(btn);
      card.appendChild(box);
      card.dataset.activateAdded='1';
    });
  }
  const run=()=>setTimeout(addButtons,80);
  new MutationObserver(run).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
  setInterval(addButtons,1200);
  window.addEventListener('hashchange',run);
  setTimeout(addButtons,500);
})();
</script>
'''
          s=s.replace(marker, script+'\n'+marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add working activate control for passive banks' || exit 0
          git push
