name: Apply invoice direction
on:
  push:
    paths:
      - '.github/workflows/apply-invoice-direction.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch invoice UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='''function newInvoice(){if(!state.data.cariler.length)return toast("Önce cari oluşturun.",true);openModal("Yeni Fatura",`<div class="notice"><b>Fatura yönünü seç:</b> Biz kestik = karşı taraf bize borçlanır. Bize geldi = biz karşı tarafa borçlanırız. Banka/kasa seçilirse ödeme/tahsilat aynı anda işlenir.</div><div class="form"><div class="field full"><label>Fatura Türü *</label><select id="fty" class="select"><option value="satis">Biz Kestik — Satış Faturası</option><option value="alis">Bize Geldi — Alış Faturası</option></select></div><div class="field"><label>Cari *</label><select id="fc" class="select">${cariOptions()}</select></div><div class="field"><label>Fatura No</label><input id="fn" class="input"></div><div class="field"><label>Tarih</label><input id="fd" class="input" type="date" value="${dateNow()}"></div><div class="field"><label>Vade</label><input id="fv" class="input" type="date"></div><div class="field"><label>Ara Toplam</label><input id="fa" class="input" type="number" step="0.01" value="0"></div><div class="field"><label>KDV %</label><input id="fk" class="input" type="number" step="0.01" value="20"></div><div class="field"><label>KDV Tutarı</label><input id="fkt" class="input" type="number" step="0.01" value="0" readonly></div><div class="field"><label>Genel Toplam *</label><input id="ft" class="input" type="number" step="0.01" value="0" readonly></div><div class="field"><label>Ödeme / Tahsilat</label><select id="fo" class="select"><option value="">Vadeli / Sonra</option><option value="Bankadan">Bankadan</option><option value="Nakit">Nakit</option></select></div><div class="field"><label>Banka</label><select id="fb" class="select"><option value="">Yok</option>${bankOptions()}</select></div><div class="field"><label>Kasa</label><select id="fkasa" class="select"><option value="">Yok</option>${cashOptions()}</select></div><div class="field full"><label>Açıklama</label><textarea id="fdesc" class="textarea"></textarea></div></div>`,async()=>{const bank=$("fb").value||null,cash=$("fkasa").value||null,kind=$("fty").value;if(bank&&cash)throw Error("Banka veya kasa seçin; ikisini birlikte kullanmayın.");if($("fo").value==="Bankadan"&&!bank)throw Error(kind==="alis"?"Bankadan ödeme için banka hesabı seçin.":"Bankadan tahsilat için banka hesabı seçin.");if($("fo").value==="Nakit"&&!cash)throw Error(kind==="alis"?"Nakit ödeme için kasa seçin.":"Nakit tahsilat için kasa seçin.");const total=num($("ft").value);if(total<=0)throw Error("Fatura toplamı 0'dan büyük olmalıdır.");const id=await rpc("finans_fatura_ekle",{p_cari:$("fc").value,p_fatura_no:$("fn").value.trim()||null,p_tarih:$("fd").value,p_vade:$("fv").value||null,p_ara:num($("fa").value),p_kdv_oran:num($("fk").value),p_kdv:num($("fkt").value),p_total:total,p_odeme:$("fo").value||null,p_aciklama:$("fdesc").value.trim()||null,p_banka:bank,p_kasa:cash,p_fatura_turu:kind});closeModal();await load();toast("Fatura kaydedildi. İşlem #"+await islemNo(id))});const calc=()=>{const ara=num($("fa").value),oran=num($("fk").value),kdv=Math.round(ara*oran)/100;$("fkt").value=kdv.toFixed(2);$("ft").value=(ara+kdv).toFixed(2)};$("fa").oninput=calc;$("fk").oninput=calc;calc()}'''
          s,n=re.subn(r'function newInvoice\(\).*?(?=function faturalar\(\))',new+'\n',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('newInvoice replacement failed')
          # Show invoice direction in the invoice list without changing stored finance values.
          s=s.replace('<th>Fatura</th><th>Cari</th>', '<th>Fatura</th><th>Tür</th><th>Cari</th>')
          s=s.replace('return `<tr><td><b>${esc(x.fatura_no||"—")}</b><br><small>${esc(x.aciklama||"")}</small></td><td>${esc(state.data.cariler.find(c=>c.id===x.cari_id)?.unvan||"—")}</td>', 'return `<tr><td><b>${esc(x.fatura_no||"—")}</b><br><small>${esc(x.aciklama||"")}</small></td><td>${x.fatura_turu==="alis"?"ALIŞ":"SATIŞ"}</td><td>${esc(state.data.cariler.find(c=>c.id===x.cari_id)?.unvan||"—")}</td>')
          s=s.replace('<td colspan="8" class="empty">Fatura bulunamadı.</td>', '<td colspan="9" class="empty">Fatura bulunamadı.</td>')
          p.write_text(s,encoding='utf-8')
      - name: Commit patch and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply-invoice-direction.yml .github/workflows/inspect-invoice.yml
          git commit -m 'Add invoice direction and automatic VAT calculation'
          git push origin main
