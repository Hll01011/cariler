name: Remove active passive account feature

on:
  push:
    paths:
      - '.github/workflows/remove-active-passive.yml'

permissions:
  contents: write

jobs:
  revert-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revert active passive feature commits
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit 3a78155a3f25b5ee0834c02dc441da05a645655b 38e647e2de4fac13d51a4975a45ce2e850548ff4 60d3ace99fb4e5608f9823dfab9fc407068d9e20 991204394d5c2fff08a58de843f804b68a18219b d21b2f05b6f1a610e0de19ce969b3a25623baf8e a48c09ae1b01d3e2b729ac74c76ec0c03e7a34a3
          git rm -f .github/workflows/remove-active-passive.yml
          git commit -m 'Remove temporary active passive cleanup workflow' || true
          git push