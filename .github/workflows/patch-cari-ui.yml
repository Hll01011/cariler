name: Patch Cari UI

on:
  push:
    paths:
      - '.github/workflows/patch-cari-ui.yml'
      - 'index.html'
      - 'sort.js'
      - 'movement-ui.js'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect application to current Supabase
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('https://qttgoxncdsbqycbkxvsl.supabase.co/rest/v1/', 'https://bfwidcfvihwfnubhovdd.supabase.co/rest/v1/')
          s = s.replace('sb_publishable_g4oxZYNdgNkjpswa-c4P1g_uzUTu9s6', 'sb_publishable_RfFpGHf6u196xmACJ7iLjg_aKskEcye')
          index.write_text(s, encoding='utf-8')
          PY
      - name: Align application transaction source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old = 'all("finans_islemleri?select=*&order=created_at.desc")'
          new = 'all("islemler?select=*&order=created_at.desc")'
          if old in s:
              s = s.replace(old, new, 1)
          index.write_text(s, encoding='utf-8')
          PY
      - name: Inject sorting module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          sort = Path('sort.js').read_text(encoding='utf-8')
          marker = '<!-- HYS_UNIVERSAL_SORT_V1 -->'
          s = index.read_text(encoding='utf-8')
          if marker not in s:
              patch = marker + '\n<style>.hys-sortbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:9px 10px;background:#f8fafc;border:1px solid #e7edf4;border-radius:11px}.hys-sortbar span{font-size:10px;font-weight:850;color:#6b7b90;text-transform:uppercase;letter-spacing:.5px}.hys-sortbar select{min-width:190px;padding:8px 10px;border:1px solid #d8e1eb;border-radius:9px;background:#fff;color:#26364d;font-size:11px;font-weight:750}.hys-sortbar button{padding:8px 10px;border-radius:9px;background:#eef3f8;color:#33445c;font-size:11px;font-weight:800}</style><script>\n' + sort + '\n</script>'
              s = s.replace('</body>', patch + '\n</body>', 1)
              index.write_text(s, encoding='utf-8')
          PY
      - name: Inject linked movement controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          module = Path('movement-ui.js').read_text(encoding='utf-8')
          marker = '<!-- HYS_MOVEMENT_UI_V2 -->'
          s = index.read_text(encoding='utf-8')
          if marker not in s:
              s = s.replace('</body>', marker + '\n<script>\n' + module + '\n</script>\n</body>', 1)
              index.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix bank movement edit visibility'
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload patched site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy patched site
        id: deployment
        uses: actions/deploy-pages@v4
