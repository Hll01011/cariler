name: Remove active passive account UI

on:
  push:
    paths:
      - '.github/workflows/remove-account-status-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove active passive account logic
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Options: never hide records by the legacy aktif flag.
          s=s.replace('function cariOptions(sel=""){return state.data.cariler.filter(x=>x.aktif!==false).map', 'function cariOptions(sel=""){return state.data.cariler.map')
          s=s.replace('function bankOptions(sel=""){return state.data.banks.filter(x=>x.aktif!==false).map', 'function bankOptions(sel=""){return state.data.banks.map')
          s=s.replace('function cashOptions(sel=""){return state.data.cash.filter(x=>x.aktif!==false).map', 'function cashOptions(sel=""){return state.data.cash.map')
          s=s.replace('d.cariler.filter(x=>x.aktif!==false).length', 'd.cariler.length')
          s=s.replace('state.data.cariler.some(x=>x.aktif!==false)', 'state.data.cariler.length>0')
          s=s.replace('if(!state.data.cariler.length>0)return toast("Önce aktif cari oluşturun.",true);', 'if(!state.data.cariler.length)return toast("Önce cari oluşturun.",true);')

          # Replace the three account pages with simple lists. No status filters/buttons.
          cariler_new='''function cariler(){let q="";$("content").innerHTML=pageHead("Cari Hesaplar","Müşteri, tedarikçi ve diğer cari hesaplar.",`<button class="btn success" onclick="newCari()">+ Yeni Cari</button><button class="btn primary" onclick="newCariMove()">+ Hareket</button>`)+`<div class="card"><div class="searchbar"><input id="cq" class="input" placeholder="Unvan, vergi no, telefon ara…"></div><div id="cariGrid"></div></div>`;const draw=()=>{q=normalize($("cq").value);const a=state.data.cariler.filter(c=>(`${c.unvan} ${c.vergi_no||""} ${c.telefon||""}`).toLocaleLowerCase("tr-TR").includes(q));$("cariGrid").innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Cari</th><th>Vergi/T.C.</th><th>Telefon</th><th>Limit</th><th>Bakiye</th><th>İşlem</th></tr></thead><tbody>${a.map(c=>{const b=balanceCari(c.id);return `<tr><td><b>${esc(c.unvan)}</b><br><small>${esc(c.yetkili||c.email||"")}</small></td><td>${esc(c.vergi_no||"—")}</td><td>${esc(c.telefon||"—")}</td><td>${money(c.limit_tutari)}</td><td class="${b>0?"danger-text":b<0?"success-text":""}">${money(Math.abs(b))}</td><td><div class="row-actions"><button class="icon-btn" onclick="cariDetail('${c.id}')">Aç</button><button class="icon-btn" onclick="editCari('${c.id}')">Düzenle</button></div></td></tr>`}).join("")||`<tr><td colspan="6" class="empty">Cari bulunamadı.</td></tr>`}</tbody></table></div>`};$("cq").oninput=draw;draw()}'''
          bankalar_new='''function bankalar(){const rows=state.data.banks;$("content").innerHTML=pageHead("Banka Hesapları","Banka hesapları, bakiyeler ve tek işlem hareket merkezi.",`<button class="btn success" onclick="newBank()">+ Banka Hesabı</button><button class="btn primary" onclick="newBankMove()">+ Banka Hareketi</button>`)+`<div class="account-grid">${rows.map(b=>`<div class="account"><div class="account-top"><div class="account-icon">▤</div><div><b>${esc(b.banka_adi)}</b><small>${esc(b.hesap_adi||"Hesap")}</small></div></div><div class="balance ${balanceBank(b.id)<0?"negative":"positive"}">${money(balanceBank(b.id))}</div><p>${esc(b.iban||"IBAN girilmemiş")}</p><div class="row-actions"><button class="icon-btn" onclick="bankDetail('${b.id}')">Hareketler</button><button class="icon-btn" onclick="editBank('${b.id}')">Düzenle</button></div></div>`).join("")||`<div class="card"><div class="empty">Banka hesabı yok.</div></div>`}</div>`}'''
          kasa_new='''function kasa(){const rows=state.data.cash;$("content").innerHTML=pageHead("Kasalar","Nakit hesapları ve tüm kasa hareketleri.",`<button class="btn success" onclick="newCash()">+ Kasa</button><button class="btn primary" onclick="newCashMove()">+ Kasa Hareketi</button>`)+`<div class="account-grid">${rows.map(k=>`<div class="account"><div class="account-top"><div class="account-icon">▣</div><div><b>${esc(k.kasa_adi)}</b><small>${esc(k.para_birimi||"TRY")}</small></div></div><div class="balance ${balanceCash(k.id)<0?"negative":"positive"}">${money(balanceCash(k.id))}</div><p>${esc(k.notlar||"")}</p><div class="row-actions"><button class="icon-btn" onclick="cashDetail('${k.id}')">Hareketler</button><button class="icon-btn" onclick="editCash('${k.id}')">Düzenle</button></div></div>`).join("")||`<div class="card"><div class="empty">Kasa yok.</div></div>`}</div>`}'''

          for name,newfn,nextfn in [('cariler',cariler_new,'newCari'),('bankalar',bankalar_new,'newBank'),('kasa',kasa_new,'newCash')]:
              pattern=rf'function {name}\(\).*?(?=function {nextfn}\()'
              s,n=re.subn(pattern,newfn+'\\n',s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{name} function replacement failed')

          # Remove legacy status mutation functions and their exports.
          s=re.sub(r'async function deactivateCari\(.*?\nfunction cariDetail', 'function cariDetail', s, count=1, flags=re.S)
          s=re.sub(r'async function deactivateBank\(.*?\nfunction bankDetail', 'function bankDetail', s, count=1, flags=re.S)
          s=re.sub(r'async function deactivateCash\(.*?\nfunction cashDetail', 'function cashDetail', s, count=1, flags=re.S)
          s=s.replace('deactivateCari,activateCari,','').replace('deactivateBank,','').replace('deactivateCash,','')

          # Remove the legacy status word from the dashboard metric.
          s=s.replace('{a:"Aktif Cari",b:d.cariler.length,c:"hesap"}', '{a:"Cari Hesap",b:d.cariler.length,c:"hesap"}')

          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/remove-account-status-ui.yml
          git commit -m 'Remove active passive account UI'
          git push origin main