name: Add activate action for passive bank accounts

on:
  push:
    paths:
      - '.github/workflows/add-passive-activate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'data-bank-status="passive"><div class="account-top">'
          new = 'data-bank-status="passive" data-bank-id="${esc(b.id)}"><div class="account-top">'
          if old not in s:
              raise SystemExit('passive card marker not found')
          s = s.replace(old, new, 1)
          old2 = '<div class="mini">Hesap durumu: <strong>Pasif</strong></div></div>`);'
          new2 = '<div class="mini">Hesap durumu: <strong>Pasif</strong></div><div class="row-actions" style="margin-top:12px"><button class="icon-btn success" onclick="hsfActivateBank(\\'${esc(b.id)}\\')">Aktifleştir</button></div></div>`);'
          if old2 not in s:
              raise SystemExit('passive card footer not found')
          s = s.replace(old2, new2, 1)
          marker = '\n</body>\n</html>\n'
          script = r'''\n<script>\n(function(){\n  window.hsfActivateBank = async function(id){\n    if(!id) return;\n    if(!confirm('Bu banka hesabını tekrar aktif hale getirmek istiyor musunuz?')) return;\n    try{\n      const r=await fetch(SB_URL+'banka_hesaplari?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({aktif:true})});\n      if(!r.ok){const t=await r.text();throw new Error(t||'Aktifleştirme başarısız.')}\n      toast('Banka hesabı tekrar aktif hale getirildi.');\n      setTimeout(()=>location.reload(),500);\n    }catch(e){toast(e.message||'Aktifleştirme başarısız.',true)}\n  };\n})();\n</script>\n'''
          if 'window.hsfActivateBank' not in s:
              s = s.replace(marker, script + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add activate action for passive banks' || exit 0
          git push
